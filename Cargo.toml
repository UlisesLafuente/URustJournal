[package]
name = "ujournal"
version = "0.5.5"
edition = "2024"
description = "UJournal: a cross-platform bullet journal written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/UlisesLafuente/URustJournal"
keywords = ["journal", "notes", "bullet-journal", "egui", "productivity"]
categories = ["gui"]

[lib]
name = "ujournal"
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6"
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "web_screen_reader",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
winit = "0.30"

[target.'cfg(target_os = "android")'.dependencies]
directories = "6"
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "android-game-activity",
    "default_fonts",
    "persistence",
    "wgpu",
] }
serde = { version = "1", features = ["derive"] }
wgpu = { version = "27.0.1", default-features = false, features = [
    "gles",
    "vulkan",
] }
winit = { version = "0.30", default-features = false, features = [
    "android-game-activity",
    "rwh_06",
] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
winit = { git = "https://github.com/rib/winit", rev = "ecb961694691ce80d066abb67784ace6713f9980" }
